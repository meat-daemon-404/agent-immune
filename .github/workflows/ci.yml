name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Decision #34's machine guard: 1.0.37 shipped a cli.js importing a
      # connect.js that was not in the tarball. Resolve every relative
      # dist import, check source↔dist 1:1, and prove the detector itself
      # catches a dead import before any release can be cut.
      - name: Dist integrity (dead imports, stale artifacts)
        run: |
          node scripts/verify-dist-integrity.mjs --self-test
          node scripts/verify-dist-integrity.mjs

      - name: Version manifests agree
        run: node scripts/check-versions.mjs

      - name: Unit tests
        run: npm test

      # The retrieval gate is fast (<1 s) and self-contained: R@3 and the
      # false-positive rate over a fixed zh/en scenario matrix. A retrieval
      # regression fails CI instead of waiting for someone to run the bench.
      - name: Recall gate
        run: node scripts/bench-recall.mjs

      # Content gate: every shipped seed rule must be recallable from a
      # paraphrased prompt, and unrelated prompts must surface nothing.
      - name: Seed-pack recall gate
        run: node scripts/bench-seed-recall.mjs

      # The connect'd (vendored) hooks driven end-to-end with NO host env
      # vars: all six events, Codex-native tool names, injection isolation
      # and guard deny. Self-contained (temp home/project, spawned node).
      - name: Connected runtime — vendored hooks, all six events
        run: node scripts/verify-connected-runtime.mjs

      # These two are self-contained (fake hosts + temp SQLite). The other two
      # acceptance scripts need a local DSH checkout / profile and stay
      # machine-only — see AGENTS.md "Verification".
      - name: Acceptance — outcome classification
        run: node scripts/verify-step1.mjs

      - name: Acceptance — loop end-to-end
        run: node scripts/verify-steps23.mjs
